<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Vu Cong Tien</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
<div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-96 border border-gray-700">
    <h2 class="text-2xl font-bold text-center text-teal-400 mb-6">ĐĂNG NHẬP</h2>
    <div class="space-y-4">
        <div>
            <label class="block text-sm text-gray-400 mb-1">Tài khoản</label>
            <input id="username" type="text" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-teal-400" placeholder="tienvu">
        </div>
        <div>
            <label class="block text-sm text-gray-400 mb-1">Mật khẩu</label>
            <input id="password" type="password" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white focus:outline-none focus:border-teal-400" placeholder="••••••">
        </div>
        <button onclick="handleLogin()" class="w-full bg-teal-500 hover:bg-teal-600 text-gray-900 font-bold p-3 rounded-lg transition duration-300">Vào Hệ Thống</button>
    </div>
</div>

<script>
    async function handleLogin() {
        const userVal = document.getElementById("username").value.trim();
        const passVal = document.getElementById("password").value.trim();

        if (!userVal || !passVal) {
            alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu!");
            return;
        }

        try {
            const res = await fetch("http://localhost:8080/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: userVal,
                    password: passVal
                })
            });

            if (res.ok) {
                const userData = await res.json();
                // Lưu thông tin vào bộ nhớ trình duyệt
                sessionStorage.setItem("user", JSON.stringify(userData));
                window.location.href = "index.html"; // Chuyển sang trang chủ
            } else {
                alert("Sai tài khoản hoặc mật khẩu!");
            }
        } catch (error) {
            console.error("Lỗi:", error);
            alert("Không kết nối được Server Backend!");
        }
    }
</script>
</body>
</html>
