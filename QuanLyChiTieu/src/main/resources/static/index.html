<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Chi Tiêu Cá Nhân</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; background-color: #1a1f2c; color: #ffffff; min-height: 100vh; }

        /* LAYOUT SIDEBAR */
        .sidebar { width: 260px; background-color: #121620; display: flex; flex-direction: column; padding: 20px; border-right: 1px solid #2d3748; position: fixed; height: 100vh; }
        .sidebar .brand { font-size: 20px; font-weight: bold; color: #4fd1c5; text-align: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #2d3748; }
        .sidebar .user-info { text-align: center; margin-bottom: 30px; background: #1a1f2c; padding: 15px; border-radius: 8px; }
        .sidebar .user-info i { font-size: 40px; color: #a0aec0; margin-bottom: 10px; }
        .sidebar .user-info p { font-size: 14px; color: #e2e8f0; font-weight: 600; }
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; }
        .sidebar-menu li a { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: #a0aec0; text-decoration: none; border-radius: 8px; transition: all 0.3s; font-size: 15px; }
        .sidebar-menu li a:hover, .sidebar-menu li.active a { background-color: #4fd1c5; color: #121620; font-weight: bold; }
        .btn-logout { background: #e53e3e; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-logout:hover { background: #c53030; }

        /* LAYOUT MAIN CONTAINER */
        .main-container { margin-left: 260px; flex-grow: 1; padding: 30px; width: calc(100% - 260px); }
        .header-title { font-size: 24px; color: #4fd1c5; margin-bottom: 25px; border-bottom: 2px solid #2d3748; padding-bottom: 10px; }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 25px; align-items: start; }
        .card { background-color: #222938; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card h3 { color: #4fd1c5; margin-bottom: 20px; font-size: 18px; border-bottom: 1px solid #2d3748; padding-bottom: 8px; }

        /* FORM NHẬP LIỆU */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #a0aec0; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 10px; background-color: #1a1f2c; border: 1px solid #2d3748; border-radius: 6px; color: white; font-size: 14px; }
        .form-control:focus { border-color: #4fd1c5; outline: none; }
        .btn-submit { width: 100%; background-color: #4fd1c5; color: #121620; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #38b2ac; transform: translateY(-1px); }

        /* BẢNG LỊCH SỬ THU CHI */
        .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        .data-table th { background-color: #121620; color: #4fd1c5; padding: 12px; border-bottom: 2px solid #2d3748; }
        .data-table td { padding: 12px; border-bottom: 1px solid #2d3748; color: #e2e8f0; }
        .data-table tr:hover { background-color: #2d3748; }
        .amount-income { color: #48bb78; font-weight: bold; }
        .amount-expense { color: #f56565; font-weight: bold; }

        /* VÙNG CHỨA BIỂU ĐỒ */
        .chart-section { margin-top: 30px; display: flex; justify-content: center; border-top: 1px solid #2d3748; padding-top: 20px; }

        /* --- CHỈ THÊM CSS BỔ TRỢ CHO KHỐI FORM DANH MỤC MỚI --- */
        .left-column { display: flex; flex-direction: column; gap: 25px; }
        .btn-secondary { background-color: #4a5568; color: white; }
        .btn-secondary:hover { background-color: #718096; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="brand"><i class="fa-solid fa-wallet"></i> FinanceTracker</div>

    <div class="user-info">
        <i class="fa-solid fa-circle-user"></i>
        <p id="txt-welcome">Đang tải...</p>
    </div>

    <ul class="sidebar-menu">
        <li class="active"><a href="#"><i class="fa-solid fa-chart-pie"></i> Tổng quan</a></li>
        <li><a href="#"><i class="fa-solid fa-list"></i> Danh mục</a></li>
        <li><a href="#"><i class="fa-solid fa-gear"></i> Cài đặt</a></li>
    </ul>

    <button class="btn-logout" onclick="handleLogout()"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
</div>

<div class="main-container">
    <div class="header-title">Hệ Thống Quản Lý Tài Chính Cá Nhân</div>

    <div class="dashboard-grid">

        <div class="left-column">

            <div class="card">
                <h3><i class="fa-solid fa-plus"></i> Thêm Giao Dịch</h3>
                <form id="transaction-form" onsubmit="saveTransaction(event)">
                    <div class="form-group">
                        <label>Tiêu đề</label>
                        <input type="text" id="title" class="form-control" placeholder="Ví dụ: Mua sắm quần áo" required>
                    </div>
                    <div class="form-group">
                        <label>Số tiền (VND - Điền số âm nếu là Chi tiêu)</label>
                        <input type="number" id="amount" class="form-control" placeholder="Ví dụ: -150000 hoặc 500000" required>
                    </div>
                    <div class="form-group">
                        <label>Danh mục</label>
                        <select id="category" class="form-control" required>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ngày giao dịch</label>
                        <input type="date" id="transactionDate" class="form-control" required>
                    </div>
                    <button type="submit" class="btn-submit">Ghi Lại Giao Dịch</button>
                </form>
            </div>

            <div class="card" style="margin-top: 5px;">
                <h3><i class="fa-solid fa-folder-plus"></i> Tạo Danh Mục Mới</h3>
                <form id="category-form" onsubmit="saveCategory(event)">
                    <div class="form-group">
                        <label>Tên danh mục</label>
                        <input type="text" id="newCategoryName" class="form-control" placeholder="Ví dụ: Tiền điện thoại, Từ thiện..." required>
                    </div>
                    <div class="form-group">
                        <label>Loại danh mục</label>
                        <select id="newCategoryType" class="form-control" required>
                            <option value="EXPENSE">Chi tiêu (Số tiền âm)</option>
                            <option value="INCOME">Thu nhập (Số tiền dương)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit btn-secondary">Thêm Danh Mục</button>
                </form>
            </div>

        </div> <div class="card">
        <h3><i class="fa-solid fa-history"></i> Lịch Sử Thu Chi</h3>
        <table class="data-table">
            <thead>
            <tr>
                <th>Ngày</th>
                <th>Tiêu đề</th>
                <th>Danh mục</th>
                <th>Số tiền (VND)</th>
            </tr>
            </thead>
            <tbody id="history-table-body">
            </tbody>
        </table>

        <div class="chart-section">
            <div style="width: 100%; max-width: 280px;">
                <canvas id="expenseChart"></canvas>
            </div>
        </div>
    </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="app.js"></script>
</body>
</html>
