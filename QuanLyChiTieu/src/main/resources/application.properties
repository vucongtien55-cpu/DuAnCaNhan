spring.application.name=QuanLyChiTieu

# Spring Boot Web Server Port
server.port=8080
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:database/schema.sql
spring.sql.init.data-locations=classpath:database/data.sql

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/quanlychitieu
spring.datasource.username=postgres
spring.datasource.password=Vucongtien123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
# update: automatically updates the PostgreSQL schema based on Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Enable logging for debugging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
