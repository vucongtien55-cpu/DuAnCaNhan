# =====================================================================
# Cấu hình RIÊNG cho môi trường TEST (thư mục src/test/resources)
# Khi chạy test, file này được ưu tiên hơn src/main/resources/application.properties,
# nên ứng dụng dùng H2 (database trong bộ nhớ) thay vì PostgreSQL.
# => Test chạy được trên Jenkins / máy bất kỳ mà không cần cài PostgreSQL.
# =====================================================================
spring.application.name=QuanLyChiTieu

# H2 in-memory, giả lập cú pháp PostgreSQL
spring.datasource.url=jdbc:h2:mem:quanlychitieu_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Tạo bảng khi bắt đầu test, xóa khi kết thúc
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

logging.level.org.hibernate.SQL=WARN
