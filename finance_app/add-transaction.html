<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi chép giao dịch - Sổ Thu Chi Cá Nhân</title>
    
    <!-- Font chữ & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --primary: #5842f4;
            --danger: #e11d48; /* Màu đỏ của nút Ghi sổ */
            --danger-bg: #f43f5e;
            --bg-body: #f1f5f9;
            --sidebar-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); }

        /* --- LAYOUT --- */
        .app-container { display: flex; min-height: 100vh; }

        /* --- SIDEBAR (Giữ nguyên đồng bộ) --- */
        .sidebar { width: 280px; background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 24px; position: fixed; height: 100vh; display: flex; flex-direction: column; }
        .logo-section { display: flex; align-items: center; gap: 12px; margin-bottom: 25px; }
        .logo-box { background: var(--primary); color: white; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; }
        .asset-card { background: #0f172a; color: white; padding: 20px; border-radius: 18px; margin-bottom: 30px; }
        .nav-menu { list-style: none; flex-grow: 1; }
        .nav-link { display: flex; align-items: center; padding: 12px 16px; text-decoration: none; color: var(--text-muted); border-radius: 12px; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
        .nav-link i { margin-right: 12px; width: 20px; font-size: 18px; }
        .nav-link.active { background: var(--danger); color: white; }

        /* --- MAIN CONTENT --- */
        .main-content { margin-left: 280px; flex-grow: 1; padding: 30px; display: flex; justify-content: center; align-items: center; }

        /* --- FORM CARD --- */
        .form-card { background: white; width: 100%; max-width: 800px; padding: 40px; border-radius: 30px; box-shadow: var(--shadow); }
        .form-title { font-size: 20px; font-weight: 800; margin-bottom: 30px; }

        /* Toggle Thu/Chi */
        .type-toggle { display: flex; background: #f1f5f9; padding: 5px; border-radius: 15px; margin-bottom: 30px; gap: 5px; }
        .toggle-btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; color: var(--text-muted); }
        .toggle-btn.active-expense { background: var(--danger); color: white; }
        .toggle-btn.active-income { background: var(--primary); color: white; }

        /* Form Group */
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px; }
        .form-group label span { color: var(--danger); }

        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 16px; }
        
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 15px 15px 15px 50px; border-radius: 15px; border: 1px solid var(--border); background: #f8fafc; font-size: 15px; font-weight: 600; outline: none; transition: 0.2s;
        }
        .form-group select { padding-left: 50px; cursor: pointer; appearance: none; }
        .form-group textarea { padding-left: 18px; height: 120px; resize: none; }
        
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--danger); background: white; }

        /* Input Đặc biệt cho Tiền */
        .amount-input { font-size: 24px !important; color: var(--text-main); }
        .amount-input::placeholder { color: #cbd5e1; font-weight: 700; }

        /* Row Layout */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        /* Footer Buttons */
        .form-footer { display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px; }
        .btn { padding: 15px 30px; border-radius: 15px; font-weight: 800; font-size: 14px; cursor: pointer; border: none; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-cancel { background: #f1f5f9; color: var(--text-muted); }
        .btn-submit { background: var(--danger); color: white; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }
        .btn-submit:hover { transform: translateY(-2px); opacity: 0.9; }

    </style>
</head>
<body>

    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-section">
                <div class="logo-box">VN</div>
                <div class="logo-text">
                    <h3 style="font-size: 16px;">Sổ Thu Chi</h3>
                    <p style="font-size: 10px;">WEB 2026</p>
                </div>
            </div>
            <div class="asset-card">
                <p style="font-size: 10px; opacity: 0.7;">TỔNG TÀI SẢN TÍCH LŨY</p>
                <h2 style="color: #fbbf24;">4.000.000 đ</h2>
            </div>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link"><i class="fa-solid fa-chart-line"></i> Báo cáo dòng tiền</a></li>
                <li class="nav-item"><a href="add-transaction.html" class="nav-link active"><i class="fa-solid fa-circle-plus"></i> Ghi chép giao dịch</a></li>
                <li class="nav-item"><a href="history.html" class="nav-link"><i class="fa-solid fa-receipt"></i> Sổ chi tiết giao dịch</a></li>
                <li class="nav-item"><a href="budget.html" class="nav-link"><i class="fa-solid fa-sliders"></i> Hạn mức ngân sách</a></li>
                <li class="nav-item"><a href="categories.html" class="nav-link"><i class="fa-solid fa-tag"></i> Quản lý danh mục</a></li>
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="form-card">
                <h2 class="form-title">Ghi chép giao dịch cá nhân mới 💰</h2>

                <!-- Toggle Thu / Chi -->
                <div class="type-toggle">
                    <button class="toggle-btn active-expense" id="btnExpense">
                        <i class="fa-solid fa-rocket"></i> Khoản Chi (Chi phí)
                    </button>
                    <button class="toggle-btn" id="btnIncome">
                        <i class="fa-solid fa-chart-line"></i> Khoản Thu (Thu nhập)
                    </button>
                </div>

                <form>
                    <!-- Số tiền -->
                    <div class="form-group">
                        <label>SỐ TIỀN (VND) <span>*</span></label>
                        <div class="input-wrapper">
                            <i>đ</i>
                            <input type="text" class="amount-input" placeholder="Ví dụ: 250000">
                        </div>
                    </div>

                    <!-- Tiêu đề -->
                    <div class="form-group">
                        <label>TIÊU ĐỀ / TÊN GIAO DỊCH <span>*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-file-lines"></i>
                            <input type="text" placeholder="Thực phẩm, trà sữa, lương tháng...">
                        </div>
                    </div>

                    <!-- Danh mục & Ngày -->
                    <div class="form-row">
                        <div class="form-group">
                            <label>DANH MỤC <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-solid fa-tag"></i>
                                <select>
                                    <option>Ăn uống</option>
                                    <option>Di chuyển</option>
                                    <option>Lương hằng tháng</option>
                                    <option>Tiền trọ</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>NGÀY THỰC HIỆN <span>*</span></label>
                            <div class="input-wrapper">
                                <i class="fa-regular fa-calendar-days"></i>
                                <input type="date" value="2026-07-07">
                            </div>
                        </div>
                    </div>

                    <!-- Ghi chú -->
                    <div class="form-group">
                        <label>GHI CHÚ (TÙY CHỌN)</label>
                        <textarea placeholder="Nhập thông tin thêm..."></textarea>
                    </div>

                    <!-- Footer -->
                    <div class="form-footer">
                        <button type="button" class="btn btn-cancel">Hủy bỏ</button>
                        <button type="submit" class="btn btn-submit">
                            <i class="fa-regular fa-circle-check"></i> Ghi sổ giao dịch
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- JavaScript để xử lý chuyển đổi Thu/Chi -->
    <script>
        const btnExpense = document.getElementById('btnExpense');
        const btnIncome = document.getElementById('btnIncome');
        const submitBtn = document.querySelector('.btn-submit');

        btnExpense.addEventListener('click', () => {
            btnExpense.classList.add('active-expense');
            btnIncome.classList.remove('active-income');
            submitBtn.style.backgroundColor = 'var(--danger)';
            // Có thể đổi màu focus của các input sang đỏ ở đây
        });

        btnIncome.addEventListener('click', () => {
            btnIncome.classList.add('active-income');
            btnExpense.classList.remove('active-expense');
            submitBtn.style.backgroundColor = 'var(--primary)';
            // Có thể đổi màu focus của các input sang tím ở đây
        });
    </script>
</body>
</html>
