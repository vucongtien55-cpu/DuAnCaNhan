# 1. C?u hình Tên ?ng D?ng và C?ng (Port)
spring.application.name=RIDE-HAILING-SERVICE
server.port=8081

# 2. C?u hình Database PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/ride_hailing
spring.datasource.username=postgres
spring.datasource.password=Vucongtien123
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. C?u hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 4. C?u hình Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# 5. C?u hình Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092

# 6. C?u hình Eureka Discovery Client
eureka.client.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true