spring.application.name=BanHangOnline

# Database PostgreSQL; credentials are supplied by the local/deployment environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/marketplace_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Vucongtien123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Hien thi SQL khi phat trien
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT key is supplied as Base64 through the deployment environment, never committed to source control.
security.jwt.secretBase64=${JWT_SECRET_BASE64:}
security.jwt.issuer=banhangonline
security.jwt.access-token-ttl=PT15M

# SMTP configuration is optional; recovery endpoints remain unavailable until configured.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${SMTP_FROM:}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:8080}
