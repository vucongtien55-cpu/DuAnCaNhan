server.port=8082

spring.application.name=novamart

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/novamart
spring.datasource.username=postgres
spring.datasource.password=Vct21092006
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migration (Tam thoi tat khi chua co script db/migration de dung Hibernate ddl-auto tao bang)
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

