<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục sản phẩm - Admin Portal</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .category-table-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-top: 24px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .data-table th {
            background: #faf8f5;
            padding: 14px 20px;
            text-align: left;
            font-weight: 700;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-color);
        }
        .data-table td {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <header class="site-header" id="siteHeader"></header>

    <div class="container section-block">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <a href="/admin-dashboard.html" style="font-size: 13px; color: var(--text-muted);">← Quay lại Admin Dashboard</a>
                <h1 style="font-size: 26px; font-weight: 800; margin-top: 4px;">Danh mục sản phẩm</h1>
            </div>
            <div>
                <button class="btn btn-primary" onclick="openAddCategoryModal()">+ Thêm danh mục mới</button>
            </div>
        </div>

        <div class="category-table-card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Tên danh mục</th>
                        <th>Đường dẫn định danh (Slug)</th>
                        <th>Danh mục cha</th>
                        <th>Mô tả chuyên mục</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="categoriesTbody">
                    <tr><td colspan="5" style="text-align: center; padding: 40px;">Đang tải danh mục...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Add Category -->
    <div id="categoryModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: white; padding: 36px; border-radius: var(--radius-lg); width: 100%; max-width: 500px; box-shadow: var(--shadow-lg);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-size: 18px; font-weight: 800;">Tạo danh mục sản phẩm mới</h3>
                <button onclick="closeCategoryModal()" style="background: none; border: none; font-size: 20px; cursor: pointer;">✕</button>
            </div>

            <form id="createCategoryForm" onsubmit="handleCreateCategory(event)">
                <div class="form-group">
                    <label class="form-label">Tên danh mục *</label>
                    <input type="text" id="catName" class="form-control" placeholder="Ví dụ: Gốm Bát Tràng men rạn" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Danh mục cha (tùy chọn)</label>
                    <select id="catParent" class="form-control">
                        <option value="">-- Là danh mục gốc (không có cha) --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Mô tả danh mục</label>
                    <textarea id="catDescription" class="form-control" rows="3" placeholder="Mô tả tiêu chuẩn, nét đặc trưng của dòng sản phẩm..."></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px;">
                    <button type="button" class="btn btn-outline" onclick="closeCategoryModal()">Hủy</button>
                    <button type="submit" class="btn btn-primary" id="saveCatBtn">Lưu danh mục</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="site-footer" id="siteFooter"></footer>

    <script src="/js/translations.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        let allCategories = [];

        async function loadCategories() {
            if (!isLoggedIn() || !hasRole('ROLE_ADMIN')) {
                window.location.href = '/login.html';
                return;
            }

            const tbody = document.getElementById('categoriesTbody');

            try {
                const res = await apiRequest('/categories');
                if (res && res.data && res.data.length > 0) {
                    allCategories = res.data;
                    tbody.innerHTML = res.data.map(c => `
                        <tr>
                            <td><strong>${c.name}</strong></td>
                            <td><code>/${c.slug}</code></td>
                            <td>${c.parentName ? `<span class="badge badge-dark">${c.parentName}</span>` : '<span style="color: var(--text-muted);">Gốc</span>'}</td>
                            <td style="color: var(--text-muted); font-size: 13px;">${c.description || '-'}</td>
                            <td><span class="badge badge-success">HOẠT ĐỘNG</span></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">Chưa có danh mục nào.</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger);">${e.message}</td></tr>`;
            }
        }

        function openAddCategoryModal() {
            document.getElementById('createCategoryForm').reset();
            const select = document.getElementById('catParent');
            select.innerHTML = '<option value="">-- Là danh mục gốc (không có cha) --</option>' + 
                allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            document.getElementById('categoryModal').style.display = 'flex';
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').style.display = 'none';
        }

        async function handleCreateCategory(e) {
            e.preventDefault();
            const btn = document.getElementById('saveCatBtn');
            btn.innerText = 'Đang lưu...';
            btn.disabled = true;

            const name = document.getElementById('catName').value.trim();
            const parentId = document.getElementById('catParent').value;
            const description = document.getElementById('catDescription').value.trim();

            let query = `/categories/admin?name=${encodeURIComponent(name)}`;
            if (description) query += `&description=${encodeURIComponent(description)}`;
            if (parentId) query += `&parentId=${parentId}`;

            try {
                await apiRequest(query, 'POST', null, true);
                showToast('Tạo danh mục thành công!', 'success');
                closeCategoryModal();
                loadCategories();
            } catch (err) {
                showToast(err.message || 'Lỗi khi tạo danh mục', 'error');
            } finally {
                btn.innerText = 'Lưu danh mục';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCategories);
    </script>
</body>
</html>
