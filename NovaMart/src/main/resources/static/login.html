<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - NovaMart</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 440px;
            margin: 60px auto;
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-md);
        }
    </style>
</head>
<body>
    <header class="site-header" id="siteHeader"></header>

    <div class="container">
        <div class="auth-container">
            <div style="text-align: center; margin-bottom: 28px;">
                <div class="logo-brand" style="justify-content: center; margin-bottom: 8px;">
                    <span>NovaMart</span>
                    <span class="logo-dot">▪</span>
                </div>
                <h2 style="font-size: 22px; font-weight: 800;">Chào mừng trở lại</h2>
                <p style="font-size: 13px; color: var(--text-muted);">Đăng nhập để khám phá các sản phẩm thủ công tinh tế</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email đăng nhập</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: baseline;">
                        <label class="form-label">Mật khẩu</label>
                        <a href="#" style="font-size: 12px; color: var(--text-muted);">Quên mật khẩu?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;" id="loginSubmitBtn">
                    Đăng nhập
                </button>
            </form>

            <!-- Quick Demo Credentials Box -->
            <div style="background: #faf8f5; border: 1px dashed var(--border-color); border-radius: var(--radius-md); padding: 14px; margin-top: 24px; font-size: 12px;">
                <div style="font-weight: 700; margin-bottom: 6px;">Tài khoản mẫu để trải nghiệm:</div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button type="button" class="btn btn-outline btn-sm" onclick="fillCredentials('admin@novamart.com', 'Admin@123456')">
                        Quản trị viên (Admin)
                    </button>
                </div>
            </div>

            <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                Chưa có tài khoản? <a href="/register.html" style="font-weight: 700; color: var(--text-dark); text-decoration: underline;">Đăng ký ngay</a>
            </div>
        </div>
    </div>

    <footer class="site-footer" id="siteFooter"></footer>

    <script src="/js/translations.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        function fillCredentials(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            btn.innerText = 'Đang xác thực...';
            btn.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await apiRequest('/auth/login', 'POST', { email, password });
                if (res && res.data) {
                    setToken(res.data.accessToken);
                    setUser(res.data);
                    showToast('Đăng nhập thành công!', 'success');

                    setTimeout(() => {
                        if (res.data.roles && res.data.roles.includes('ROLE_ADMIN')) {
                            window.location.href = '/admin-dashboard.html';
                        } else if (res.data.roles && res.data.roles.includes('ROLE_SELLER')) {
                            window.location.href = '/seller-dashboard.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    }, 500);
                }
            } catch (err) {
                showToast(err.message || 'Email hoặc mật khẩu không chính xác', 'error');
                btn.innerText = 'Đăng nhập';
                btn.disabled = false;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (isLoggedIn()) {
                window.location.href = '/index.html';
            }
        });
    </script>
</body>
</html>
