<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - NovaMart</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 40px;
            margin-top: 30px;
        }
        .shop-group-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            margin-bottom: 24px;
            overflow: hidden;
        }
        .shop-group-header {
            padding: 16px 24px;
            background: #faf8f5;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cart-item-row {
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 80px 1fr 140px 140px 40px;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .cart-item-row:last-child {
            border-bottom: none;
        }
        .cart-item-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius-sm);
        }
        .cart-summary-card {
            background: var(--bg-white);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px;
            position: sticky;
            top: 90px;
            height: fit-content;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 14px;
        }
        @media (max-width: 900px) {
            .cart-layout { grid-template-columns: 1fr; }
            .cart-item-row { grid-template-columns: 60px 1fr; }
        }
    </style>
</head>
<body>
    <header class="site-header" id="siteHeader"></header>

    <div class="container section-block">
        <h1 style="font-size: 26px; font-weight: 800; margin-bottom: 24px;" data-i18n="my_cart_title">Giỏ hàng của bạn</h1>

        <div id="cartContentWrapper">
            <div style="text-align: center; padding: 60px;">Đang tải giỏ hàng...</div>
        </div>
    </div>

    <footer class="site-footer" id="siteFooter"></footer>

    <script src="/js/translations.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        async function loadCart() {
            if (!isLoggedIn()) {
                window.location.href = '/login.html';
                return;
            }

            const wrapper = document.getElementById('cartContentWrapper');

            try {
                const res = await apiRequest('/cart', 'GET', null, true);
                if (!res || !res.data || !res.data.shopGroups || res.data.shopGroups.length === 0) {
                    wrapper.innerHTML = `
                        <div style="text-align: center; background: var(--bg-white); padding: 80px 20px; border-radius: var(--radius-lg); border: 1px solid var(--border-color);">
                            <div style="font-size: 48px; margin-bottom: 16px;">🛒</div>
                            <h3 style="font-size: 20px; font-weight: 700; margin-bottom: 10px;" data-i18n="empty_cart">Giỏ hàng của bạn đang trống</h3>
                            <p style="color: var(--text-muted); margin-bottom: 24px;">Hãy khám phá các tác phẩm thủ công tinh xảo trên NovaMart.</p>
                            <a href="/products.html" class="btn btn-primary btn-lg" data-i18n="continue_shopping">Tiếp tục mua sắm</a>
                        </div>
                    `;
                    return;
                }

                const cart = res.data;

                wrapper.innerHTML = `
                    <div class="cart-layout">
                        <!-- Left: Groups by Shop -->
                        <div>
                            ${cart.shopGroups.map(group => `
                                <div class="shop-group-card">
                                    <div class="shop-group-header">
                                        🏪 Gian hàng: <a href="/products.html?shopId=${group.shopId}" style="color: var(--text-dark);">${group.shopName}</a>
                                    </div>
                                    <div>
                                        ${group.items.map(item => `
                                            <div class="cart-item-row">
                                                <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=200&q=80'}" class="cart-item-thumb">
                                                <div>
                                                    <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 4px;">${item.productName}</h4>
                                                    <span style="font-size: 13px; color: var(--text-muted);">Biến thể: ${item.variantName}</span>
                                                </div>
                                                <div style="font-weight: 700; font-size: 15px;">
                                                    ${formatPrice(item.unitPrice)}
                                                </div>
                                                <div style="display: flex; align-items: center; gap: 8px;">
                                                    <button class="btn btn-outline btn-sm" onclick="changeQuantity(${item.cartItemId}, ${item.quantity - 1})">-</button>
                                                    <span style="font-weight: 700;">${item.quantity}</span>
                                                    <button class="btn btn-outline btn-sm" onclick="changeQuantity(${item.cartItemId}, ${item.quantity + 1})">+</button>
                                                </div>
                                                <div>
                                                    <button onclick="removeItem(${item.cartItemId})" title="Xóa" style="background: none; border: none; cursor: pointer; color: var(--danger); font-size: 16px;">🗑️</button>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <!-- Right: Summary -->
                        <div>
                            <div class="cart-summary-card">
                                <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 20px;">Tóm tắt đơn hàng</h3>
                                <div class="summary-row">
                                    <span style="color: var(--text-muted);" data-i18n="subtotal">Tạm tính</span>
                                    <span style="font-weight: 700;">${formatPrice(cart.grandTotal)}</span>
                                </div>
                                <div class="summary-row">
                                    <span style="color: var(--text-muted);" data-i18n="shipping_fee">Phí vận chuyển</span>
                                    <span style="font-weight: 600; color: var(--success);">Miễn phí</span>
                                </div>
                                <hr style="border: none; border-top: 1px solid var(--border-color); margin: 16px 0;">
                                <div class="summary-row" style="font-size: 18px;">
                                    <span style="font-weight: 800;" data-i18n="grand_total">Tổng thanh toán</span>
                                    <span style="font-weight: 800; color: #191716;">${formatPrice(cart.grandTotal)}</span>
                                </div>
                                <a href="/checkout.html" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 20px;" data-i18n="checkout_btn">
                                    Tiến hành đặt hàng →
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                applyTranslations();
            } catch (e) {
                wrapper.innerHTML = `<div style="text-align: center; color: var(--danger); padding: 40px;">${e.message}</div>`;
            }
        }

        async function changeQuantity(itemId, qty) {
            try {
                await apiRequest(`/cart/items/${itemId}?quantity=${qty}`, 'PATCH', null, true);
                loadCart();
                updateCartCount();
            } catch (e) {
                showToast(e.message || 'Lỗi cập nhật số lượng', 'error');
            }
        }

        async function removeItem(itemId) {
            if (!confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?')) return;
            try {
                await apiRequest(`/cart/items/${itemId}`, 'DELETE', null, true);
                showToast('Đã xóa sản phẩm khỏi giỏ hàng', 'success');
                loadCart();
                updateCartCount();
            } catch (e) {
                showToast(e.message || 'Lỗi khi xóa', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
