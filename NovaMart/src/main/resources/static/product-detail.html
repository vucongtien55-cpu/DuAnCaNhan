<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - NovaMart</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-top: 40px;
            background: var(--bg-white);
            padding: 40px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .gallery-main-img {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }
        .gallery-thumbs {
            display: flex;
            gap: 12px;
            margin-top: 14px;
            overflow-x: auto;
        }
        .gallery-thumb {
            width: 70px;
            height: 70px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            cursor: pointer;
            border: 2px solid transparent;
            opacity: 0.7;
            transition: var(--transition);
        }
        .gallery-thumb.active, .gallery-thumb:hover {
            border-color: #191716;
            opacity: 1;
        }
        .variant-pill {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            margin-right: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: var(--transition);
        }
        .variant-pill:hover, .variant-pill.active {
            border-color: #191716;
            background: #191716;
            color: #ffffff;
        }
        .quantity-control {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            overflow: hidden;
        }
        .quantity-btn {
            background: transparent;
            border: none;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
        }
        .quantity-input {
            width: 48px;
            text-align: center;
            border: none;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }
        .shop-info-card {
            background: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 30px;
        }
        @media (max-width: 850px) {
            .product-detail-layout { grid-template-columns: 1fr; padding: 20px; }
            .gallery-main-img { height: 320px; }
        }
    </style>
</head>
<body>
    <header class="site-header" id="siteHeader"></header>

    <div class="container section-block" id="productDetailContainer">
        <div style="text-align: center; padding: 60px;">Đang tải chi tiết sản phẩm...</div>
    </div>

    <footer class="site-footer" id="siteFooter"></footer>

    <script src="/js/translations.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/navbar.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;
        let selectedVariant = null;

        async function loadProductDetail() {
            if (!productId) {
                window.location.href = '/products.html';
                return;
            }

            try {
                const res = await apiRequest(`/products/${productId}`);
                if (res && res.data) {
                    currentProduct = res.data;
                    renderDetail();
                }
            } catch (e) {
                document.getElementById('productDetailContainer').innerHTML = `
                    <div style="text-align: center; padding: 60px;">
                        <h3>Không tìm thấy sản phẩm!</h3>
                        <a href="/products.html" class="btn btn-primary" style="margin-top: 14px;">Quay lại danh sách</a>
                    </div>
                `;
            }
        }

        function renderDetail() {
            const container = document.getElementById('productDetailContainer');
            const images = currentProduct.imageUrls && currentProduct.imageUrls.length > 0 
                ? currentProduct.imageUrls 
                : ['https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=800&q=80'];

            if (!selectedVariant && currentProduct.variants && currentProduct.variants.length > 0) {
                selectedVariant = currentProduct.variants[0];
            }

            container.innerHTML = `
                <div class="product-detail-layout">
                    <!-- Gallery -->
                    <div>
                        <img src="${images[0]}" alt="${currentProduct.name}" class="gallery-main-img" id="mainImage">
                        <div class="gallery-thumbs">
                            ${images.map((img, idx) => `
                                <img src="${img}" class="gallery-thumb ${idx === 0 ? 'active' : ''}" 
                                     onclick="changeMainImage('${img}', this)">
                            `).join('')}
                        </div>
                    </div>

                    <!-- Info -->
                    <div>
                        <div class="badge badge-dark" style="margin-bottom: 12px;">${currentProduct.categoryName || 'Thủ công'}</div>
                        <h1 style="font-size: 28px; font-weight: 800; line-height: 1.3; margin-bottom: 14px;">${currentProduct.name}</h1>
                        
                        <div style="display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px;">
                            <span style="font-size: 30px; font-weight: 800; color: #191716;" id="displayPrice">
                                ${formatPrice(selectedVariant ? selectedVariant.price : currentProduct.minPrice)}
                            </span>
                            <span style="font-size: 14px; color: var(--text-muted);" id="stockBadge">
                                ${selectedVariant ? `Tồn kho: ${selectedVariant.stockAvailable} sản phẩm` : ''}
                            </span>
                        </div>

                        <!-- Variants Selection -->
                        <div style="margin-bottom: 24px;">
                            <label class="form-label" data-i18n="select_variant">Chọn biến thể:</label>
                            <div id="variantsContainer">
                                ${currentProduct.variants.map((v, i) => `
                                    <div class="variant-pill ${v.id === selectedVariant.id ? 'active' : ''}" 
                                         onclick="selectVariant(${v.id})">
                                        ${v.variantName} - ${formatPrice(v.price)}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Quantity -->
                        <div style="margin-bottom: 30px;">
                            <label class="form-label" data-i18n="quantity">Số lượng:</label>
                            <div class="quantity-control">
                                <button class="quantity-btn" onclick="updateQty(-1)">-</button>
                                <input type="number" id="qtyInput" value="1" min="1" max="99" class="quantity-input" readonly>
                                <button class="quantity-btn" onclick="updateQty(1)">+</button>
                            </div>
                        </div>

                        <!-- Actions -->
                        <div style="display: flex; gap: 16px;">
                            <button class="btn btn-primary btn-lg" style="flex: 1;" onclick="addToCart(false)" data-i18n="add_to_cart">
                                🛒 Thêm vào giỏ
                            </button>
                            <button class="btn btn-accent btn-lg" style="flex: 1;" onclick="addToCart(true)" data-i18n="buy_now">
                                Mua ngay
                            </button>
                        </div>

                        <!-- Shop Card -->
                        <div class="shop-info-card">
                            <div>
                                <span style="font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted);">XƯỞNG CHẾ TÁC</span>
                                <h4 style="font-size: 16px; font-weight: 700;">${currentProduct.shopName}</h4>
                            </div>
                            <a href="/products.html?shopId=${currentProduct.shopId}" class="btn btn-outline btn-sm">Xem gian hàng</a>
                        </div>
                    </div>
                </div>

                <!-- Description -->
                <div style="background: var(--bg-white); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 36px; margin-top: 30px;">
                    <h3 style="font-size: 20px; font-weight: 800; margin-bottom: 16px;" data-i18n="description">Mô tả sản phẩm</h3>
                    <div style="line-height: 1.8; color: var(--text-muted); font-size: 15px;">
                        ${currentProduct.description ? currentProduct.description.replace(/\n/g, '<br>') : 'Sản phẩm được chế tác tỉ mỉ từ nghệ nhân tay nghề cao, tuyển chọn nguyên liệu thượng hạng.'}
                    </div>
                </div>
            `;
            applyTranslations();
        }

        function changeMainImage(src, el) {
            document.getElementById('mainImage').src = src;
            document.querySelectorAll('.gallery-thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function selectVariant(variantId) {
            selectedVariant = currentProduct.variants.find(v => v.id === variantId);
            document.getElementById('displayPrice').innerText = formatPrice(selectedVariant.price);
            document.getElementById('stockBadge').innerText = `Tồn kho: ${selectedVariant.stockAvailable} sản phẩm`;
            document.querySelectorAll('.variant-pill').forEach((el, idx) => {
                el.classList.toggle('active', currentProduct.variants[idx].id === variantId);
            });
        }

        function updateQty(delta) {
            const input = document.getElementById('qtyInput');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (selectedVariant && val > selectedVariant.stockAvailable) {
                showToast(`Chỉ còn ${selectedVariant.stockAvailable} sản phẩm trong kho!`, 'error');
                return;
            }
            input.value = val;
        }

        async function addToCart(buyNow = false) {
            if (!isLoggedIn()) {
                showToast('Vui lòng đăng nhập để thêm sản phẩm vào giỏ hàng!', 'info');
                setTimeout(() => window.location.href = '/login.html', 1200);
                return;
            }

            if (!selectedVariant) {
                showToast('Vui lòng chọn biến thể sản phẩm!', 'error');
                return;
            }

            const quantity = parseInt(document.getElementById('qtyInput').value);

            try {
                await apiRequest('/cart/items', 'POST', {
                    variantId: selectedVariant.id,
                    quantity: quantity
                }, true);

                showToast('Đã thêm sản phẩm vào giỏ hàng thành công!', 'success');
                updateCartCount();

                if (buyNow) {
                    setTimeout(() => window.location.href = '/cart.html', 500);
                }
            } catch (e) {
                showToast(e.message || 'Lỗi khi thêm giỏ hàng', 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadProductDetail);
    </script>
</body>
</html>
