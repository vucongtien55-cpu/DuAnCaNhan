spring.application.name=lms

# Nạp biến cấu hình cục bộ từ file .env (nằm ở thư mục chạy, đã được .gitignore). Biến môi trường thật vẫn được ưu tiên.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${LMS_DB_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${LMS_DB_USERNAME:postgres}
# Không có giá trị mặc định: thiếu LMS_DB_PASSWORD thì ứng dụng không khởi động (không đưa secret vào Git)
spring.datasource.password=${LMS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Service đã ánh xạ sang DTO trong giao dịch, không cần giữ phiên JPA mở suốt request
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Bảo mật JWT. Đặt LMS_JWT_SECRET (tối thiểu 32 byte, ngẫu nhiên) khi triển khai; để trống thì dùng khóa tạm theo mỗi
# lần khởi động (token mất hiệu lực khi khởi động lại). Thời hạn access token cấu hình được, tối đa 24 giờ.
app.security.jwt.secret=${LMS_JWT_SECRET:}
app.security.jwt.access-token-ttl=1h
app.security.jwt.issuer=lms
# Origin của frontend được phép gọi API (liệt kê, cách nhau bằng dấu phẩy; không dùng '*')
app.security.cors.allowed-origins=${LMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Admin đầu tiên: chỉ được tạo khi cả hai biến LMS_ADMIN_USERNAME và LMS_ADMIN_PASSWORD hợp lệ và chưa có Admin nào hoạt động
app.admin.username=${LMS_ADMIN_USERNAME:}
app.admin.password=${LMS_ADMIN_PASSWORD:}
app.admin.email=${LMS_ADMIN_EMAIL:}
app.admin.full-name=${LMS_ADMIN_FULL_NAME:Quản trị viên}

# File storage: thư mục lưu tài liệu trên máy chủ, đặt bằng biến môi trường LMS_UPLOAD_DIR khi triển khai
app.storage.upload-dir=${LMS_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Mặc định Tomcat chỉ "nuốt" 2MB phần thân còn lại của request bị từ chối rồi ngắt kết nối, client sẽ không nhận được 413.
# Nâng lên 50MB để upload vượt giới hạn (tới 50MB) nhận 413 JSON thống nhất; request lớn hơn vẫn bị ngắt kết nối.
server.tomcat.max-swallow-size=50MB

# Phân trang: giới hạn kích thước trang để một request không kéo cả bảng
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Giới hạn tần suất (lưu trong bộ nhớ từng instance: chạy N instance thì giới hạn thực tế ~ N lần; cần giới hạn chính xác
# toàn cụm thì dùng Redis/API gateway). Request ghi: tối đa "burst" liên tiếp rồi hồi phục "per-minute" mỗi phút, tính theo
# người dùng đã đăng nhập. Upload tính thêm bucket riêng. Đăng nhập chỉ đếm lần SAI, theo (IP, tên đăng nhập) và theo IP.
app.rate-limit.enabled=${LMS_RATE_LIMIT_ENABLED:true}
app.rate-limit.write.burst=60
app.rate-limit.write.per-minute=120
app.rate-limit.upload.burst=10
app.rate-limit.upload.per-minute=20
app.rate-limit.login.max-failures-per-account=5
app.rate-limit.login.max-failures-per-ip=100
app.rate-limit.login.window=15m
# Chạy sau reverse proxy/load balancer tin cậy: đặt server.forward-headers-strategy=native (hoặc LMS_FORWARD_HEADERS) để IP
# client lấy đúng từ X-Forwarded-For của proxy; nếu không, mọi người dùng sẽ cùng một IP (của proxy) với bộ giới hạn đăng nhập.
server.forward-headers-strategy=${LMS_FORWARD_HEADERS:none}

# Swagger UI / OpenAPI: TẮT mặc định. Chỉ bật khi phát triển (LMS_DOCS_ENABLED=true); khi tắt, /v3/api-docs và /swagger-ui
# không tồn tại và bị SecurityConfig từ chối như mọi đường dẫn ngoài /api.
app.docs.enabled=${LMS_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${app.docs.enabled}
springdoc.swagger-ui.enabled=${app.docs.enabled}
# Không lưu JWT nhập trong Swagger UI vào localStorage của trình duyệt
springdoc.swagger-ui.persist-authorization=false
springdoc.show-actuator=false
