spring.application.name=lms

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lms
spring.datasource.username=postgres
spring.datasource.password=Vucongtien123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Service đã ánh xạ sang DTO trong giao dịch, không cần giữ phiên JPA mở suốt request
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# Bảo mật JWT. Đặt LMS_JWT_SECRET (tối thiểu 32 byte, ngẫu nhiên) khi triển khai; để trống thì dùng khóa tạm theo mỗi
# lần khởi động (token mất hiệu lực khi khởi động lại). Thời hạn access token cấu hình được, tối đa 24 giờ.
app.security.jwt.secret=${LMS_JWT_SECRET:}
app.security.jwt.access-token-ttl=1h
app.security.jwt.issuer=lms
# Origin của frontend được phép gọi API (liệt kê, cách nhau bằng dấu phẩy; không dùng '*')
app.security.cors.allowed-origins=${LMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Admin đầu tiên: chỉ được tạo khi cả hai biến LMS_ADMIN_USERNAME và LMS_ADMIN_PASSWORD hợp lệ và chưa có Admin nào hoạt động
app.admin.username=${LMS_ADMIN_USERNAME:}
app.admin.password=${LMS_ADMIN_PASSWORD:}
app.admin.email=${LMS_ADMIN_EMAIL:}
app.admin.full-name=${LMS_ADMIN_FULL_NAME:Quản trị viên}

# File storage: thư mục lưu tài liệu trên máy chủ, đặt bằng biến môi trường LMS_UPLOAD_DIR khi triển khai
app.storage.upload-dir=${LMS_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
