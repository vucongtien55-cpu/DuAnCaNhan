spring.application.name=API-GATEWAY
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# 1. Route Identity Service (Không qua Filter)
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Route Wallet Service (G?n AuthenticationFilter)
spring.cloud.gateway.routes[1].id=wallet-service
spring.cloud.gateway.routes[1].uri=lb://WALLET-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/wallets/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# 3. Route Trip Service (G?n AuthenticationFilter)
spring.cloud.gateway.routes[2].id=ride-hailing-service
spring.cloud.gateway.routes[2].uri=lb://RIDE-HAILING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/trips/**, /api/v1/users/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter